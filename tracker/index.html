<title>Weigh-In Partners</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centered column; two partner cards side by side, then a shared chart, the check-in form and the weekly feed. */
:root {
  --bg: #eef2f5; --surface: #ffffff; --sunk: #e4eaef; --ink: #142029; --muted: #5a6875; --line: #d6dee5;
  --p0: #0e8487; --p1: #c46d17; --p2: #6d4fe0; --p3: #c93b66;
  --good: #23874a; --warn: #a86a05; --onaccent: #ffffff;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1318; --surface: #162029; --sunk: #1d2a35; --ink: #e6edf2; --muted: #93a2ae; --line: #283643;
  --p0: #3cc3c6; --p1: #f09b48; --p2: #a28cff; --p3: #f07399;
  --good: #52c77d; --warn: #e8ac3c; --onaccent: #0d1318; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1318; --surface: #162029; --sunk: #1d2a35; --ink: #e6edf2; --muted: #93a2ae; --line: #283643;
  --p0: #3cc3c6; --p1: #f09b48; --p2: #a28cff; --p3: #f07399;
  --good: #52c77d; --warn: #e8ac3c; --onaccent: #0d1318; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 20px; font-weight: 600; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
button, .btn { font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink);
  padding: 9px 14px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--p0); outline-offset: 2px; }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.ghost { background: transparent; }
button.small { padding: 5px 10px; font-size: 13px; }
button:disabled { opacity: .55; cursor: default; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; }
textarea { resize: vertical; min-height: 84px; }
label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

/* header */
header.top { display: grid; gap: 10px; }
.weekline { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.whoami { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--sunk); color: var(--ink); border: 1px solid transparent; }
.chip.on { border-color: currentColor; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }

/* team banner */
.team { border-radius: var(--r); padding: 16px 20px; background: var(--ink); color: var(--bg); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.team strong { font-family: var(--display); font-size: 19px; font-weight: 600; }
.team .big { font-family: var(--mono); font-size: 28px; }

/* partner cards */
.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.pcard { display: grid; gap: 14px; border-top: 4px solid var(--c); }
.pcard .pct { font-family: var(--mono); font-size: 46px; line-height: 1; color: var(--c); letter-spacing: -0.03em; }
.pcard .pct small { font-size: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats > div { min-width: 0; }
.stats > div { display: grid; gap: 2px; }
.stats .num { font-size: 16px; }
.bar { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 12px; font-family: var(--mono); padding: 2px 8px; border-radius: 6px; border: 1px dashed var(--line); color: var(--muted); }
.badge.got { border-style: solid; border-color: var(--c); color: var(--c); }
.why { font-style: italic; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }

/* chart */
.chartbox { position: relative; min-width: 0; }
.chartbox svg { display: block; width: 100%; }
.chartbox text { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }

/* form */
.formgrid { display: grid; gap: 14px; }
.moods { display: flex; gap: 8px; flex-wrap: wrap; }
.moods input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.moods label { cursor: pointer; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: 14px; }
.moods input:checked + label { border-color: var(--ink); background: var(--sunk); }
.moods input:focus-visible + label { outline: 2px solid var(--p0); outline-offset: 2px; }
.preview { max-height: 160px; border-radius: 10px; }
.status { font-size: 13.5px; min-height: 1.4em; }
.status.err { color: var(--p3); }
.tip { font-size: 13px; color: var(--muted); background: var(--sunk); border-radius: 10px; padding: 10px 12px; }

/* feed */
.feed { display: grid; gap: 14px; }
.weekhead { font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); padding-top: 6px; }
.entry { display: grid; gap: 10px; border-left: 4px solid var(--c); }
.entry .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.entry .who { font-weight: 700; color: var(--c); }
.entry .w { font-family: var(--mono); font-size: 20px; }
.delta { font-family: var(--mono); font-size: 13px; }
.delta.down { color: var(--good); } .delta.up { color: var(--warn); }
.note { white-space: pre-wrap; overflow-wrap: anywhere; }
.photo { max-width: min(100%, 340px); max-height: 340px; border-radius: 10px; cursor: zoom-in; background: var(--sunk); }
.cheers { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cheer { padding: 4px 9px; font-size: 14px; border-radius: 999px; }
.cheer.mine { border-color: var(--ink); }
.cheernotes { display: grid; gap: 6px; }
.cheernote { font-size: 14px; background: var(--sunk); border-radius: 10px; padding: 7px 11px; overflow-wrap: anywhere; }
.cheernote b { color: var(--c); }
/* my week */
.myweek { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
.myweek > div { display: grid; gap: 12px; align-content: start; min-width: 0; }
.taps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tap { text-align: left; padding: 12px; border-radius: 12px; display: grid; gap: 2px; background: var(--bg); }
.tap .t { font-size: 14px; }
.tap .s { font-size: 12px; font-weight: 500; color: var(--muted); }
.tap.on { background: var(--c); border-color: var(--c); color: var(--onaccent); }
.tap.on .s { color: inherit; opacity: .8; }
.daybtns { display: flex; gap: 6px; flex-wrap: wrap; }
.daybtn { padding: 4px 9px; font-size: 12.5px; border-radius: 8px; }
.daybtn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.commits { display: grid; gap: 8px; }
.commit { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); min-width: 0; }
.commit .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.commit.hit .txt { color: var(--good); font-weight: 600; }
.commit.miss .txt { color: var(--muted); text-decoration: line-through; }
.mark { width: 22px; flex: none; text-align: center; font-weight: 700; }
.hit .mark { color: var(--good); } .miss .mark { color: var(--warn); }
.ideas { display: flex; gap: 6px; flex-wrap: wrap; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.strip > div { display: grid; gap: 3px; justify-items: center; font-size: 11px; color: var(--muted); }
.strip i { width: 100%; height: 22px; border-radius: 6px; background: var(--sunk); border: 1px solid transparent; }
.strip .today i { border-color: var(--ink); }
.minicommits { display: grid; gap: 4px; font-size: 13.5px; }
.minicommits div { display: flex; gap: 6px; }
/* recap */
.recap { display: grid; gap: 12px; }
.recap .body { display: grid; gap: 10px; max-width: 68ch; }
.recap .body p { margin: 0; }
.empty { text-align: left; display: grid; gap: 10px; padding: 28px 20px; }
.lightbox { position: fixed; inset: 0; background: rgba(5,10,14,.86); display: grid; place-items: center; z-index: 50;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
.banner { padding: 12px 16px; border-radius: 10px; background: var(--sunk); font-size: 14px; }
@media (max-width: 480px) { .pcard .pct { font-size: 40px; } .panel { padding: 16px; } }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .6s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="label" id="weekLabel">Weekly check-ins</div>
    <h1>Weigh-In Partners</h1>
    <div class="weekline muted">Progress is measured as % of starting body weight, so everyone is on the same scale.</div>
    <div class="whoami" id="whoami"></div>
  </header>
  <div id="notice" hidden class="banner"></div>
  <div id="teamBanner" hidden class="team"></div>
  <section class="people" id="people"></section>
  <section class="panel" id="setupPanel" hidden></section>
  <section class="panel" id="myWeekPanel" hidden></section>
  <section class="panel recap" id="recapPanel" hidden></section>
  <section class="panel" id="chartPanel" hidden>
    <div class="row between"><h2>% of body weight lost</h2><div class="legend" id="legend"></div></div>
    <div class="chartbox" id="chart"></div>
  </section>
  <section class="panel" id="checkinPanel" hidden></section>
  <section id="feedSection" hidden>
    <div class="row between" style="margin-bottom:10px"><h2>Check-in log</h2></div>
    <div class="feed" id="feed"></div>
  </section>
</div>
<div class="lightbox" id="lightbox" hidden><img id="lightImg" alt="Progress photo, enlarged"></div>

<script>
(() => {
  const COLORS = ["var(--p0)", "var(--p1)", "var(--p2)", "var(--p3)"];
  const MILESTONES = [1, 2.5, 5, 7.5, 10, 15, 20];
  const MOODS = { great: "Great week", okay: "Okay week", rough: "Rough week" };
  const CHEERS = ["💪", "👏", "🔥", "🙌"];
  const LS_KEY = "weighin.me";
  const HABITS = [["workout", "Worked out"], ["water", "Drank enough water"], ["steps", "Hit my steps"], ["plan", "Ate on plan"]];
  const IDEAS = ["Work out 3 times", "No soda on weekdays", "8k steps 5 days", "Pack lunch 4 days", "In bed by 11", "Log every meal"];

  const S = { db: null, user: null, assets: null, uid: null, canWrite: true, readOnly: false,
    people: [], checkins: [], cheers: [], commits: [], days: [], recaps: [], sample: null, recapBusy: false, tapDay: null, draft: "", loaded: { people: false }, me: null, editing: null, confirmDel: null, photoFile: null };

  try { S.me = localStorage.getItem(LS_KEY); } catch (e) {}

  // ---------- helpers ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.style.cssText = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  }
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const weekKey = s => ymd(monday(parse(s)));
  const fmtDate = s => parse(s).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  const fmtShort = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const fmt1 = n => (Math.round(n * 10) / 10).toFixed(1);
  const pctLost = (p, w) => (p.startWeight - w) / p.startWeight * 100;
  const color = p => COLORS[(p.colorIndex ?? 0) % COLORS.length];
  const personById = id => S.people.find(p => p.id === id);
  const thisWeek = () => ymd(monday(new Date()));
  const prevWeek = k => { const d = parse(k); d.setDate(d.getDate() - 7); return ymd(d); };

  function entriesFor(pid) { return S.checkins.filter(c => c.pid === pid).sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0)); }
  function weeksFor(pid) { return new Set(entriesFor(pid).map(c => weekKey(c.date))); }
  function streak(weeks) {
    let k = thisWeek(); if (!weeks.has(k)) k = prevWeek(k);
    let n = 0; while (weeks.has(k)) { n++; k = prevWeek(k); } return n;
  }
  function teamStreak() {
    if (S.people.length < 2) return 0;
    const sets = S.people.map(p => weeksFor(p.id));
    const all = new Set([...sets[0]].filter(k => sets.every(s => s.has(k))));
    return streak(all);
  }
  function stats(p) {
    const es = entriesFor(p.id);
    const last = es[es.length - 1];
    const current = last ? last.weight : p.startWeight;
    const lost = pctLost(p, current);
    const goalPct = p.goalWeight ? (p.startWeight - p.goalWeight) / p.startWeight * 100 : null;
    const toGoal = goalPct ? Math.max(0, Math.min(100, lost / goalPct * 100)) : null;
    const weeks = weeksFor(p.id);
    const best = Math.max(0, ...es.map(e => pctLost(p, e.weight)));
    return { es, last, current, lost, goalPct, toGoal, streak: streak(weeks), doneThisWeek: weeks.has(thisWeek()), best };
  }

  // ---------- render ----------
  function render() {
    renderHeader(); renderTeam(); renderPeople(); renderSetup(); renderMyWeek(); renderChart(); renderRecap(); renderCheckin(); renderFeed();
  }

  function renderHeader() {
    const start = S.people.length ? S.people.map(p => p.startDate).sort()[0] : null;
    const wk = start ? Math.floor((monday(new Date()) - monday(parse(start))) / 6048e5) + 1 : null;
    const sun = monday(new Date()); sun.setDate(sun.getDate() + 6);
    document.getElementById("weekLabel").textContent = (wk ? `Week ${wk} · ` : "") + `Check in by Sunday, ${fmtShort(sun)}`;
    const box = document.getElementById("whoami"); box.replaceChildren();
    if (!S.people.length) return;
    box.append(h("span", { class: "muted", style: "font-size:13px" }, S.me && personById(S.me) ? "Checking in as" : "Who are you?"));
    for (const p of S.people) {
      box.append(h("button", { class: "chip" + (S.me === p.id ? " on" : ""), style: `--c:${color(p)};color:${S.me === p.id ? color(p) : "var(--ink)"}`,
        "aria-pressed": S.me === p.id ? "true" : "false", onclick: () => setMe(p.id) }, h("span", { class: "dot" }), p.name));
    }
    if (!S.readOnly && S.people.length < 4)
      box.append(h("button", { class: "small ghost", onclick: () => { S.editing = "new"; render(); scrollTo("setupPanel"); } }, "+ Add a partner"));
  }

  function renderTeam() {
    const el = document.getElementById("teamBanner");
    if (S.people.length < 2) { el.hidden = true; return; }
    el.hidden = false;
    const all = S.people.map(stats);
    const doneCount = all.filter(s => s.doneThisWeek).length;
    const ts = teamStreak();
    const avg = all.reduce((a, s) => a + s.lost, 0) / all.length;
    let msg;
    if (doneCount === all.length) msg = ts > 1 ? `Everyone checked in. ${ts} weeks in a row together.` : "Everyone checked in this week. Nice work, team.";
    else if (doneCount === 0) msg = "New week. Who's weighing in first?";
    else { const waiting = S.people.filter((p, i) => !all[i].doneThisWeek).map(p => p.name).join(" and "); msg = `Waiting on ${waiting} this week.`; }
    el.replaceChildren(
      h("div", {}, h("div", { class: "label", style: "color:inherit;opacity:.7" }, "Team this week"), h("strong", {}, msg)),
      h("div", { style: "display:flex;gap:22px" },
        h("div", {}, h("div", { class: "label", style: "color:inherit;opacity:.7" }, "Team streak"), h("div", { class: "big" }, `${ts} wk`)),
        h("div", {}, h("div", { class: "label", style: "color:inherit;opacity:.7" }, "Average lost"), h("div", { class: "big" }, `${fmt1(avg)}%`)))
    );
  }

  function renderPeople() {
    const box = document.getElementById("people"); box.replaceChildren();
    if (!S.loaded.people) { box.append(h("div", { class: "panel muted" }, "Loading your check-ins…")); return; }
    if (!S.people.length) {
      box.append(h("div", { class: "panel empty" },
        h("h2", {}, "Start your pact"),
        h("p", { class: "muted", style: "margin:0" }, "Each of you adds a profile with your starting weight. Then check in once a week with your weight, a note about how it went, and a photo if you like. You'll both see each other's progress here and can cheer each other on."),
        S.readOnly ? h("p", { class: "muted" }, "Ask the page owner for edit access so you can add your profile.") :
          h("div", {}, h("button", { class: "primary", onclick: () => { S.editing = "new"; render(); scrollTo("setupPanel"); } }, "Add your profile"))));
      return;
    }
    for (const p of S.people) {
      const s = stats(p);
      const unit = p.unit || "lb";
      const change = s.current - p.startWeight;
      box.append(h("article", { class: "panel pcard", style: `--c:${color(p)}` },
        h("div", { class: "row between" },
          h("h2", {}, p.name),
          s.doneThisWeek ? h("span", { class: "pill good" }, "✓ Checked in") : h("span", { class: "pill warn" }, "Due this week")),
        h("div", {},
          h("div", { class: "label" }, "Body weight lost"),
          h("div", { class: "pct" }, fmt1(s.lost), h("small", {}, "%"))),
        h("div", { class: "stats" },
          h("div", {}, h("span", { class: "label" }, "Streak"), h("span", { class: "num" }, `${s.streak} wk`)),
          h("div", {}, h("span", { class: "label" }, "Daily streak"), h("span", { class: "num" }, `${dayStreak(p.id)} d`)),
          h("div", {}, h("span", { class: "label" }, "Change"), h("span", { class: "num" }, `${change > 0 ? "+" : ""}${fmt1(change)} ${unit}`))),
        p.goalWeight ? h("div", { style: "display:grid;gap:6px" },
          h("div", { class: "row between", style: "font-size:13px" },
            h("span", { class: "muted" }, `Goal: ${fmt1(s.goalPct)}% (${p.goalWeight} ${unit})`),
            h("span", { class: "num" }, `${Math.round(s.toGoal)}%`)),
          h("div", { class: "bar", role: "img", "aria-label": `${Math.round(s.toGoal)}% of the way to goal` }, h("i", { style: `width:${s.toGoal}%` }))) : null,
        h("div", { class: "badges", "aria-label": "Milestones" },
          MILESTONES.filter(m => !s.goalPct || m <= Math.max(s.goalPct, 5) + 0.01).map(m =>
            h("span", { class: "badge" + (s.best >= m ? " got" : ""), title: s.best >= m ? "Reached" : "Not yet" }, `${m}%`))),
        weekStrip(p),
        miniCommits(p),
        p.why ? h("div", { class: "why note" }, p.why) : null,
        S.readOnly ? null : h("div", {}, h("button", { class: "small ghost", onclick: () => { S.editing = p.id; render(); scrollTo("setupPanel"); } }, "Edit profile"))
      ));
    }

    prev.src = URL.createObjectURL(file); prev.hidden = false;
  }

  async function shrink(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return await new Promise(res => c.toBlob(res, "image/jpeg", 0.84));
    } finally { URL.revokeObjectURL(url); }
  }

  async function submitCheckin(e) {
    e.preventDefault();
    const f = e.target, st = document.getElementById("ci-status"), btn = document.getElementById("ci-submit");
    const me = personById(S.me); if (!me) return;
    const weight = parseFloat(f.weight.value);
    if (!(weight > 0)) { st.className = "status err"; st.textContent = "Enter your weight as a number."; return; }
    btn.disabled = true; st.className = "status";
    try {
      let photo = null;
      if (S.photoFile && S.assets) {
        st.textContent = "Uploading photo…";
        let blob;
        try { blob = await shrink(S.photoFile); } catch (err) { throw { code: "photo_read" }; }
        const up = await S.assets.upload(blob, { type: "image/jpeg" });
        photo = up.id;
      }
      st.textContent = "Saving…";
      await S.db.collection("checkins").add({ pid: me.id, date: f.date.value, weight, mood: f.mood.value, note: f.note.value.trim(), photo, createdAt: Date.now(), by: S.uid || null });
      const before = stats(me);
      document.getElementById("ci-form").dataset.pid = ""; // allow a fresh form
      render();
      const s2 = document.getElementById("ci-status");
      if (s2) { s2.className = "status"; s2.textContent = `Saved. ${before.streak > 1 ? before.streak + "-week streak." : "Check-in logged."}`; }
    } catch (err) {
      btn.disabled = false;
      if (err?.code === "photo_read") { st.className = "status err"; st.textContent = "That photo couldn't be read. Try a JPEG or PNG, or save without a photo."; return; }
      if (err?.code === "too_large") { st.className = "status err"; st.textContent = "That photo is too large. Try a smaller one."; return; }
      if (err?.code === "quota_or_state") { st.className = "status err"; st.textContent = "Photo storage is full. Delete an old photo check-in, or save without a photo."; return; }
      failWrite(st, err);
    }
  }

  function failWrite(st, err) {
    st.className = "status err";
    if (err?.code === "invalid_argument") { st.textContent = "You don't have permission to save here. Ask the owner to share the page with you as an Editor."; S.readOnly = true; setTimeout(render, 2500); }
    else if (err?.code === "rate_limited" || err?.code === "resource_exhausted") st.textContent = "Too many saves at once. Wait a moment and try again.";
    else st.textContent = "Couldn't save just now. Check your connection and try again.";
  }

  // ---------- feed ----------
  function renderFeed() {
    const sec = document.getElementById("feedSection"), feed = document.getElementById("feed");
    if (!S.people.length) { sec.hidden = true; return; }
    sec.hidden = false;
    const items = S.checkins.filter(c => personById(c.pid)).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
    feed.replaceChildren();
    if (!items.length) { feed.append(h("div", { class: "panel muted" }, "No check-ins yet. The first one sets the baseline for the chart.")); return; }
    let wk = null;
    for (const c of items) {
      const k = weekKey(c.date);
      if (k !== wk) { wk = k; const end = parse(k); end.setDate(end.getDate() + 6); feed.append(h("div", { class: "weekhead" }, k === thisWeek() ? "This week" : `Week of ${fmtShort(parse(k))} – ${fmtShort(end)}`)); }
      feed.append(entryEl(c));
    }
  }

  function entryEl(c) {
    const p = personById(c.pid), unit = p.unit || "lb";
    const es = entriesFor(p.id), i = es.findIndex(e => e.id === c.id);
    const prev = i > 0 ? es[i - 1].weight : p.startWeight;
    const d = c.weight - prev;
    const mine = S.me === p.id && !S.readOnly;
    const cheers = S.cheers.filter(x => x.checkinId === c.id);
    const canCheer = S.me && personById(S.me) && S.me !== p.id && !S.readOnly;
    const el = h("article", { class: "panel entry", style: `--c:${color(p)}` },
      h("div", { class: "meta" },
        h("span", { class: "who" }, p.name),
        h("span", { class: "muted" }, fmtDate(c.date)),
        c.mood ? h("span", { class: "chip" }, MOODS[c.mood] || c.mood) : null),
      h("div", { class: "meta" },
        h("span", { class: "w" }, `${c.weight} ${unit}`),
        h("span", { class: "delta " + (d < 0 ? "down" : d > 0 ? "up" : "") }, `${d > 0 ? "+" : d < 0 ? "−" : "±"}${fmt1(Math.abs(d))} ${i > 0 ? "since last" : "from start"}`),
        h("span", { class: "delta", style: "color:var(--c)" }, `${fmt1(pctLost(p, c.weight))}% total`)),
      c.note ? h("div", { class: "note" }, c.note) : null,
      c.photo ? h("img", { class: "photo", src: "/_blob/" + c.photo, alt: `${p.name}'s progress photo, ${fmtDate(c.date)}`, loading: "lazy",
        onclick: ev => openLight(ev.target.src), onerror: ev => ev.target.replaceWith(h("div", { class: "tip" }, "Photo not available on this view.")) }) : null,
      cheerRow(c, cheers, canCheer),
      cheerNotes(cheers),
      mine ? delRow(c) : null
    );
    return el;
  }

  function cheerRow(c, cheers, canCheer) {
    const counts = CHEERS.map(e => ({ e, list: cheers.filter(x => x.emoji === e) })).filter(x => x.list.length || canCheer);
    if (!counts.length && !canCheer) return null;
    const row = h("div", { class: "cheers" });
    for (const { e, list } of counts) {
      const meDid = list.some(x => x.fromPid === S.me);
      const names = list.map(x => personById(x.fromPid)?.name || "Someone").join(", ");
      row.append(h("button", { class: "cheer small" + (meDid ? " mine" : ""), disabled: !canCheer, title: names || "Send a cheer", "aria-label": `${e} ${list.length}${names ? " from " + names : ""}`,
        onclick: () => toggleCheer(c, e, meDid) }, `${e} ${list.length || ""}`.trim()));
    }
    if (canCheer) {
      const inp = h("input", { id: "cn-" + c.id, placeholder: "Leave some encouragement", maxlength: 200, style: "flex:1;min-width:160px;padding:6px 10px" });
      row.append(h("form", { class: "row", style: "flex:1;gap:6px;min-width:0", onsubmit: ev => { ev.preventDefault(); sendNote(c, inp); } }, inp, h("button", { class: "small", type: "submit" }, "Send")));
    }
    return row;
  }
  function cheerNotes(cheers) {
    const notes = cheers.filter(x => x.text).sort((a, b) => a.createdAt - b.createdAt);
    if (!notes.length) return null;
    return h("div", { class: "cheernotes" }, notes.map(n => { const fp = personById(n.fromPid);
      return h("div", { class: "cheernote", style: `--c:${fp ? color(fp) : "var(--muted)"}` }, h("b", {}, (fp?.name || "Someone") + ": "), n.text); }));
  }
  async function toggleCheer(c, emoji, has) {
    const id = `${c.id}_${S.me}_${CHEERS.indexOf(emoji)}`;
    try { has ? await S.db.doc("cheers/" + id).delete() : await S.db.doc("cheers/" + id).set({ checkinId: c.id, fromPid: S.me, emoji, createdAt: Date.now() }); } catch (e) {}
  }
  async function sendNote(c, inp) {
    const text = inp.value.trim(); if (!text) return;
    inp.disabled = true;
    try { await S.db.collection("cheers").add({ checkinId: c.id, fromPid: S.me, text, createdAt: Date.now() }); inp.value = ""; } catch (e) { inp.placeholder = "Couldn't send. Try again."; }
    inp.disabled = false;
  }
  function delRow(c) {
    if (S.confirmDel === c.id) return h("div", { class: "row" }, h("span", { class: "muted", style: "font-size:13px" }, "Delete this check-in?"),
      h("button", { class: "small", onclick: () => delCheckin(c) }, "Delete"), h("button", { class: "small ghost", onclick: () => { S.confirmDel = null; renderFeed(); } }, "Keep"));
    return h("div", {}, h("button", { class: "small ghost", onclick: () => { S.confirmDel = c.id; renderFeed(); } }, "Delete"));
  }
  async function delCheckin(c) {
    S.confirmDel = null;
    try {
      await S.db.doc("checkins/" + c.id).delete();
      for (const x of S.cheers.filter(x => x.checkinId === c.id)) await S.db.doc("cheers/" + x.id).delete().catch(() => {});
      if (c.photo && S.assets) S.assets.delete(c.photo).catch(() => {});
    } catch (e) {}
  }

  function openLight(src) { const lb = document.getElementById("lightbox"); document.getElementById("lightImg").src = src; lb.hidden = false; }
  document.getElementById("lightbox").addEventListener("click", () => { document.getElementById("lightbox").hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("lightbox").hidden = true; });
  function scrollTo(id) { requestAnimationFrame(() => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" })); }

  // ---------- boot ----------
  render();
  (async () => {
    const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    const [db, user, assets, sample] = await Promise.all([use("db"), use("user"), use("assets"), use("sample")]);
    S.sample = sample;
    S.db = db; S.user = user; S.assets = assets;
    const notice = document.getElementById("notice");
    if (!db) { S.loaded.people = true; S.readOnly = true; notice.hidden = false; notice.textContent = "Sign in to claude.ai to see and save check-ins on this page."; render(); return; }
    if (user) {
      S.uid = await user.id().catch(() => null);
      const cw = await user.can("data.write");
      if (cw === false) { S.readOnly = true; notice.hidden = false; notice.textContent = "You can view this page but not add check-ins. Ask the owner to share it with you as an Editor."; }
    }
    const docs = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
    db.collection("people").onSnapshot(snap => {
      S.people = docs(snap).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); S.loaded.people = true;
      if (!personById(S.me)) { const mine = S.uid && S.people.find(p => p.claimedBy === S.uid); S.me = mine ? mine.id : null; }
      render();
    }, () => { S.loaded.people = true; render(); });
    db.collection("checkins").onSnapshot(snap => { S.checkins = docs(snap); renderTeam(); renderPeople(); renderChart(); renderFeed(); renderHeader(); });
    db.collection("cheers").onSnapshot(snap => { S.cheers = docs(snap); renderFeed(); });
    const since = new Date(); since.setDate(since.getDate() - 70);
    db.collection("days").where("date", ">=", ymd(since)).limit(1000).onSnapshot(snap => { S.days = docs(snap); renderMyWeek(); renderPeople(); });
    db.collection("commitments").where("week", ">=", ymd(monday(since))).limit(1000).onSnapshot(snap => { S.commits = docs(snap); renderMyWeek(); renderPeople(); });
    db.collection("recaps").onSnapshot(snap => { S.recaps = docs(snap); if (!S.recapBusy) renderRecap(); });
  })();
})();
</script>
